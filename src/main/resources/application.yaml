logging:
  config: classpath:log4j2.xml

server:
  servlet:
    context-path: /OrbitAPI

orbitapi:
  cors:
    origens-permitidas: "http://localhost:5173"

spring:
  application:
    name: orbitapi

  servlet:
    encoding:
      charset: UTF-8
      force: true

  jpa:
    open-in-view: false

  data:
    redis:
      repositories:
        enabled: false

  flyway:
    enabled: true
    schemas: orbitapi
    default-schema: orbitapi
    baseline-on-migrate: true

  web:
    error:
      include-stacktrace: never

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9018

orbitapi:
  cors:
    origens-permitidas: "http://localhost:[*],http://127.0.0.1:[*]"

---

spring:
  config:
    activate:
      on-profile: prod

server:
  port: 9028

---

spring:
  config:
    activate:
      on-profile: test

  cache:
    type: none

  flyway:
    locations: classpath:db/migration,classpath:db/test
